name: Build Goktay Browser

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3 python3-pip

    - name: Run Mach Build
      run: |
        ./mach build
        ./mach package

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Goktay-Browser-Linux
        path: obj-x86_64-pc-linux-gnu/dist/firefox-*.tar.xz
        
