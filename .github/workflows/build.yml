name: Build Goktay Browser Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Restore Build Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/sccache
          ~/.mozbuild
        key: ${{ runner.os }}-mozbuild-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-mozbuild-

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3 python3-pip curl git sccache unzip zip

    - name: Create Android Mozconfig
      run: |
        echo 'ac_add_options --enable-project=mobile/android' > .mozconfig
        echo 'ac_add_options --target=aarch64-linux-android' >> .mozconfig
        echo 'ac_add_options --enable-optimize' >> .mozconfig
        echo 'ac_add_options --disable-debug' >> .mozconfig
        echo 'ac_add_options --disable-tests' >> .mozconfig
        echo 'ac_add_options --with-ccache=sccache' >> .mozconfig
        echo 'mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-android' >> .mozconfig

    - name: Bootstrap and Build APK
      run: |
        ./mach --no-interactive bootstrap --application-choice=mobile_android
        ./mach build
        ./mach package

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Goktay-Browser-Android-APK
        path: "**/*.apk"
        
